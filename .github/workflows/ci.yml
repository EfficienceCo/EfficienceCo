name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  testes:
    name: Testes (backend e agente)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agente/worker/requirements.txt

      - name: Instalar dependências do backend e executor
        run: |
          npm ci
          npm --prefix backend ci

      - name: Preparar o agente Python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -r agente/worker/requirements.txt

      # O npm test também inclui os testes do hook quando a TEST-5 for integrada.
      - name: Rodar o comando único com banco descartável
        run: |
          mkdir -p "$RUNNER_TEMP/ci-681"
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-681/npm-test.log"

      - name: Guardar resultado dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-testes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-681/npm-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Build do frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm --prefix frontend ci

      - name: Compilar o frontend para produção
        run: |
          mkdir -p "$RUNNER_TEMP/ci-681"
          npm --prefix frontend run build 2>&1 | tee "$RUNNER_TEMP/ci-681/frontend-build.log"

      - name: Guardar resultado do build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-frontend-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-681/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7
