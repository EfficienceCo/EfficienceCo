<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Efficience Co — Demo Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens (design-system/colors_and_type.css) ===================== */
:root{
  --brand-50:#F0F9FF;--brand-100:#E0F2FE;--brand-200:#BAE6FD;--brand-300:#7DD3FC;--brand-400:#38BDF8;--brand-500:#0EA5E9;--brand-600:#0284C7;--brand-700:#0369A1;--brand-800:#075985;--brand-900:#0C4A6E;
  --slate-50:#F8FAFC;--slate-100:#F1F5F9;--slate-200:#E2E8F0;--slate-300:#CBD5E1;--slate-400:#94A3B8;--slate-500:#64748B;--slate-600:#475569;--slate-700:#334155;--slate-800:#1E293B;--slate-900:#0F172A;
  --success-100:#D1FAE5;--success-500:#10B981;--success-600:#059669;--success-700:#047857;
  --warning-100:#FEF3C7;--warning-500:#F59E0B;--warning-600:#D97706;--warning-700:#B45309;
  --danger-100:#FFE4E6;--danger-500:#F43F5E;--danger-600:#E11D48;--danger-700:#BE123C;
  --bg:var(--slate-100);--border:var(--slate-200);--fg:var(--slate-900);--fg-muted:var(--slate-500);
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-sans:'Manrope',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:9999px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 1px rgba(15,23,42,.04);
  --dur:180ms;--ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);}
body{font-family:var(--font-sans);color:var(--fg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
a{color:var(--brand-700);}
svg{width:16px;height:16px;flex-shrink:0;display:inline-block;vertical-align:-3px;}
#app{height:100vh;}
.tnum{font-variant-numeric:tabular-nums;}

/* ===================== Login ===================== */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(700px 380px at 20% -8%,rgba(56,189,248,.16),transparent 65%),linear-gradient(190deg,#0B1422,#070d18 72%);padding:24px;}
.login-card{width:380px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.10);border-radius:var(--r-xl);padding:32px 28px;backdrop-filter:blur(6px);}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.login-brand .wm{font-family:var(--font-display);font-weight:600;font-size:17px;color:#fff;letter-spacing:-0.02em;}
.login-eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-300);margin-bottom:8px;}
.login-h{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:23px;color:#fff;letter-spacing:-0.01em;}
.login-sub{margin:0 0 22px;font-size:13.5px;color:var(--slate-400);line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate-300);margin-bottom:6px;}
.field input{width:100%;padding:10px 12px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;font-size:13.5px;outline:none;transition:border-color var(--dur);}
.field input:focus{border-color:var(--brand-400);}
.field input::placeholder{color:var(--slate-500);}
.btn{border:none;border-radius:var(--r-md);font-weight:600;font-size:13.5px;padding:10px 16px;transition:background var(--dur) var(--ease-out),transform var(--dur) var(--ease-out);}
.btn-primary{width:100%;background:linear-gradient(160deg,var(--brand-400),var(--brand-600));color:#052235;padding:11px 16px;margin-top:4px;}
.btn-primary:hover{transform:translateY(-1px);}
.login-hint{margin-top:16px;font-size:11.5px;color:var(--slate-500);text-align:center;}

/* ===================== Shell ===================== */
.shell{display:flex;height:100vh;overflow:hidden;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.scroll{flex:1;overflow-y:auto;}

/* ===================== Sidebar ===================== */
.sidebar{width:250px;flex:none;display:flex;flex-direction:column;background:radial-gradient(420px 200px at 30% -6%,rgba(14,165,233,.16),transparent 70%),linear-gradient(190deg,#0B1422,#070d18 70%);border-right:1px solid rgba(255,255,255,.06);color:var(--slate-300);}
.sb-brand{padding:20px 18px 18px;display:flex;gap:11px;align-items:center;}
.sb-wm{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-0.02em;color:#fff;}
.sb-wm .co{color:var(--slate-500);}
.sb-nav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px;}
.sb-section{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--slate-600);padding:16px 10px 7px;}
.ni{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-md);font-weight:500;font-size:13.5px;color:var(--slate-400);border:1px solid transparent;text-align:left;background:none;width:100%;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out);}
.ni:hover{background:rgba(255,255,255,.05);color:#fff;}
.ni.active{background:rgba(56,189,248,.12);color:#fff;font-weight:600;}
.ni.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-400);}
.ni svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;flex:none;}
.ni.active svg{color:var(--brand-300);}
.agent-card{margin:4px 12px 10px;padding:12px 13px;border-radius:var(--r-lg);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
.agent-top{display:flex;align-items:center;gap:9px;}
.heartbeat{width:9px;height:9px;border-radius:50%;background:var(--success-500);position:relative;flex:none;}
.heartbeat::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--success-500);animation:hb 2.2s var(--ease-out) infinite;}
@keyframes hb{0%{transform:scale(.6);opacity:.9;}70%,100%{transform:scale(1.9);opacity:0;}}
.agent-name{font-weight:600;font-size:12.5px;color:#fff;}
.agent-state{margin-left:auto;font-size:11px;color:var(--success-500);font-weight:600;}
.agent-meta{font-size:11px;color:var(--slate-500);margin-top:7px;}
.sb-user{margin:0 12px 14px;padding:11px 12px;border-radius:var(--r-lg);display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.06);}
.avatar{width:32px;height:32px;border-radius:var(--r-full);background:linear-gradient(160deg,var(--brand-400),var(--brand-600));color:#052235;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
.sb-uname{font-weight:600;font-size:12.5px;color:#fff;line-height:1.2;}
.sb-umail{font-size:11px;color:var(--slate-500);}
.sb-logout{margin-left:auto;color:var(--slate-500);background:none;border:none;display:inline-flex;padding:5px;border-radius:6px;transition:color var(--dur),background var(--dur);}
.sb-logout:hover{color:#fff;background:rgba(255,255,255,.06);}
.sb-logout svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;}

/* ===================== Topbar ===================== */
.topbar{height:60px;flex:none;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;}
.crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-muted);}
.crumb .sep{color:var(--slate-300);}
.crumb .here{color:var(--slate-900);font-weight:600;}
.tb-actions{display:flex;align-items:center;gap:10px;}
.competencia{display:flex;align-items:center;gap:8px;background:var(--slate-100);border:1px solid var(--border);border-radius:var(--r-md);padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--slate-700);}
.competencia svg{width:15px;height:15px;stroke:var(--brand-600);stroke-width:1.9;fill:none;}
.icon-btn{width:36px;height:36px;border-radius:var(--r-md);border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-600);position:relative;}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.icon-btn .ping{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger-500);border:2px solid #fff;}

/* ===================== Page ===================== */
.page{padding:26px 30px 46px;display:flex;flex-direction:column;gap:18px;max-width:1280px;}
.page-head h1{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-0.02em;color:var(--slate-900);margin:0;}
.page-head p{font-size:14px;color:var(--fg-muted);margin:7px 0 0;}
.crumbline{margin:0 0 4px;font-size:13px;color:var(--fg-muted);}
.crumbline b{color:var(--brand-700);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media (max-width:1120px){.grid2{grid-template-columns:1fr;}.grid3{grid-template-columns:1fr 1fr;}.grid4{grid-template-columns:1fr 1fr;}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--slate-100);}
.card-head h2{margin:0;font-size:16px;font-weight:600;color:var(--slate-900);}

/* ===================== Automation cards ===================== */
.acard{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:18px;transition:border-color var(--dur) var(--ease-out),transform var(--dur) var(--ease-out);text-align:left;display:block;width:100%;}
.acard.clickable{cursor:pointer;}
.acard.clickable:hover{border-color:var(--slate-300);transform:translateY(-1px);}
.acard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.acard-ico{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-md);background:var(--brand-50);color:var(--brand-700);flex:none;}
.acard-ico svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;}
.acard-title{margin-top:12px;font-weight:600;font-size:14px;color:var(--slate-900);}
.acard-desc{margin-top:4px;font-size:13px;line-height:1.5;color:var(--fg-muted);}

/* ===================== Badges / tables ===================== */
.badge{display:inline-flex;align-items:center;border-radius:var(--r-full);padding:4px 10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge-ok{background:var(--success-100);color:var(--success-700);box-shadow:inset 0 0 0 1px #A7F3D0;}
.badge-warn{background:var(--warning-100);color:var(--warning-700);box-shadow:inset 0 0 0 1px #FDE68A;}
.badge-err{background:var(--danger-100);color:var(--danger-700);box-shadow:inset 0 0 0 1px #FECDD3;}
.badge-neutral{background:var(--slate-100);color:var(--slate-600);box-shadow:inset 0 0 0 1px var(--slate-200);}
.tbl-wrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;}
th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);background:var(--slate-50);padding:9px 16px;white-space:nowrap;}
td{padding:11px 16px;font-size:13px;color:var(--slate-700);border-top:1px solid var(--slate-100);white-space:nowrap;}
.mono{font-family:var(--font-mono);}
.strong{font-weight:600;color:var(--slate-900);}

/* ===================== KPI stats ===================== */
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:16px 18px;}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);}
.stat-value{margin-top:8px;font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--slate-900);}

/* ===================== Progress / checklist ===================== */
.progress-track{flex:1;height:8px;border-radius:var(--r-full);background:var(--slate-200);overflow:hidden;}
.progress-fill{height:100%;border-radius:var(--r-full);}
.proc-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--slate-100);}
.proc-row:first-child{border-top:none;padding-top:0;}
.proc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.proc-name{font-size:13.5px;font-weight:600;color:var(--slate-900);}
.proc-bar{display:flex;align-items:center;gap:10px;}
.proc-pct{font-size:12px;font-weight:600;color:var(--slate-500);min-width:32px;text-align:right;}
.step-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--slate-100);font-size:13.5px;color:var(--slate-800);}
.step-row:first-child{border-top:none;}
.step-note{font-size:11.5px;color:var(--slate-400);}
.step-empty{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--slate-300);flex:none;}

/* ===================== Log / timeline ===================== */
.log-item{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--slate-100);}
.log-item:first-child{border-top:none;}
.log-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;}
.log-dot.info{background:var(--brand-500);}
.log-dot.sucesso{background:var(--success-500);}
.log-dot.alerta{background:var(--warning-500);}
.log-text{font-size:13.5px;color:var(--slate-800);}
.log-meta{font-size:11.5px;color:var(--fg-muted);margin-top:2px;}

/* ===================== Filters / segradio / buttons ===================== */
.filter{border-radius:var(--r-md);border:1px solid var(--slate-300);background:#fff;padding:8px 14px;font-size:13.5px;color:var(--slate-700);}
.seg{display:inline-flex;border-radius:var(--r-md);border:1px solid var(--slate-300);background:#fff;padding:4px;box-shadow:var(--shadow-sm);}
.seg button{padding:6px 14px;border-radius:6px;font-size:13.5px;color:var(--slate-600);background:none;border:none;font-weight:500;}
.seg button.active{background:var(--slate-900);color:#fff;font-weight:600;}
.btn-dark{border-radius:var(--r-md);background:var(--slate-900);color:#fff;padding:9px 16px;font-size:13.5px;font-weight:600;border:none;}
.btn-line{border-radius:var(--r-md);border:1px solid var(--slate-300);background:#fff;padding:8px 14px;font-size:13px;font-weight:500;color:var(--slate-700);}
.btn-confirm{border-radius:6px;border:1px solid #6EE7B7;background:#ECFDF5;color:#047857;padding:5px 12px;font-size:12px;font-weight:600;}
.btn-reject{border-radius:6px;border:1px solid #FDA4AF;background:#FFF1F2;color:#BE123C;padding:5px 12px;font-size:12px;font-weight:600;}
.link-btn{font-size:12.5px;font-weight:600;color:var(--brand-700);background:none;border:none;padding:0;margin-right:14px;}
.footnote{padding:14px 20px;border-top:1px solid var(--slate-100);font-size:12px;color:var(--slate-400);line-height:1.6;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================================

   Single-file, vanilla JS. Every automation shows "Disponível" — this is the

   ============================================================================ */

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s); }
function fmtBRL(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function statusKind(t){
  var s = (t||'').toLowerCase();
  if (/atras|vencid|rejeitad/.test(s)) return 'err';
  if (/pendente|andamento|apura|fechamento|valida|gerando|diverg|renova.*inici|inicia|n[aã]o configurado|n[aã]o iniciado|vence em|aguardando/.test(s)) return 'warn';
  return 'ok';
}
function badge(text, kindOverride){
  var kind = kindOverride || statusKind(text);
  return '<span class="badge badge-'+kind+'">'+esc(text)+'</span>';
}
function cell(v, isLast, isStatusCol){
  if (isStatusCol) return '<td>'+badge(v)+'</td>';
  return '<td>'+esc(v)+'</td>';
}
function table(cols, rows){
  var statusIdx = cols.indexOf('Status');
  var head = '<tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
  var body = rows.map(function(r){
    return '<tr>'+r.map(function(v,i){ return cell(v, i===r.length-1, i===statusIdx); }).join('')+'</tr>';
  }).join('');
  return '<div class="tbl-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}

  var body = CLIENTES.map(function(c){ return '<tr><td class="strong">'+c.nome+'</td><td class="mono">'+c.cnpj+'</td><td>'+c.regime+'</td><td>'+c.func+'</td><td>'+badge('Ativo','ok')+'</td><td><button class="link-btn">Ver detalhes</button><button class="link-btn">Editar</button></td></tr>'; }).join('');
  return '<div class="page"><div class="page-head" style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;"><h1>Clientes do escritório</h1><button class="btn-dark">'+icon('plus')+' Novo cliente</button></div>'
  + '<div class="grid4"><div class="stat"><div class="stat-label">Clientes ativos</div><div class="stat-value tnum">5</div></div><div class="stat"><div class="stat-label">Automações este mês</div><div class="stat-value tnum">312</div></div><div class="stat"><div class="stat-label">Obrigações em atraso</div><div class="stat-value tnum" style="color:var(--danger-700)">3</div></div><div class="stat"><div class="stat-label">Licença</div><div class="stat-value" style="font-size:18px;">Válida — ago/2027</div></div></div>'
  + '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>CNPJ</th><th>Regime tributário</th><th>Funcionários</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+body+'</tbody></table></div></div></div>';
}

/* ---------- Login ---------- */
function renderLogin(){
  return '<div class="login"><form class="login-card" id="login-form">'
  + '<div class="login-brand">'+LOGO_SVG(34)+'<span class="wm">Efficience Co</span></div>'
  + '<div class="login-eyebrow">Plataforma</div><h1 class="login-h">Entrar na plataforma</h1><p class="login-sub">Escritório Pereira Contabilidade · use seu e-mail e senha para acessar.</p>'
  + '<div class="field"><label>E-mail</label><input type="email" id="login-email" value="joao@escritoriopereira.com.br"></div>'
  + '<div class="field"><label>Senha</label><input type="password" id="login-senha" value="demo1234"></div>'
  + '<button class="btn btn-primary" type="submit">Entrar</button>'
  + '<div class="login-hint">Protegido por JWT · dados tratados conforme a LGPD</div>'
  + '</form></div>';
}

/* ---------- router / dispatch ---------- */
function currentRoute(){ return (location.hash || '#dashboard').slice(1); }
function pageFor(route){
  if (route.indexOf('automacao/') === 0){
    var a = AUT_BY_ID[route.slice('automacao/'.length)];
    if (!a) return renderDashboard();
    if (a.tipo === 'bespoke') return BESPOKE[a.id]();
    if (a.tipo === 'tabela') return renderTabelaDetail(a);
    if (a.tipo === 'resumo') return renderResumoDetail(a);
    if (a.tipo === 'log') return renderLogDetail(a);
    if (a.tipo === 'progresso') return renderProgressoDetail(a);
    return renderTabelaDetail(a);
  }
  switch(route){
    case 'dashboard': return renderDashboard();
    case 'roi': return renderROI();
    case 'obrigacoes': return renderObrigacoes();
    case 'processos': return renderProcessos();
    case 'logs': return renderLogsPage();
    case 'regras': return renderRegras();
    case 'usuarios': return renderUsuarios();
    case 'admin': return renderAdmin();
    case 'fiscal': case 'contabil': case 'dp': case 'societario': case 'financeiro': case 'atendimento':
      return renderArea(route);
    default: return renderDashboard();
  }
}
var BESPOKE = { 'escrituracao-nfe':renderEscrituracao, 'conciliacao-bancaria':renderConciliacao, 'folha-pagamento':renderFolha, 'abertura-empresa':renderAbertura };
function activeNavKey(route){
  if (route.indexOf('automacao/') === 0){ var a = AUT_BY_ID[route.slice(10)]; return a ? a.area : 'dashboard'; }
  return route;
}

var MODAL_CSS_INJECTED = false;
function injectModalCss(){
  if (MODAL_CSS_INJECTED) return; MODAL_CSS_INJECTED = true;
  var css = '.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}'
  + '.modal-box{width:420px;max-width:100%;background:#fff;border-radius:var(--r-xl);box-shadow:0 24px 64px -16px rgba(15,23,42,.35);}'
  + '.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--slate-100);}'
  + '.modal-title{font-size:15.5px;font-weight:700;color:var(--slate-900);}'
  + '.modal-sub{font-size:12.5px;color:var(--fg-muted);margin-top:3px;}'
  + '.modal-body{padding:18px 20px;}'
  + '.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--slate-100);}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
}

function render(){
  var app = document.getElementById('app');
  if (!STATE.user){ app.innerHTML = renderLogin(); bindLogin(); return; }
  injectModalCss();
  var route = currentRoute();
  app.innerHTML = '<div class="shell">' + renderSidebar(activeNavKey(route)) + '<div class="main">' + renderTopbar(activeNavKey(route)) + '<div class="scroll">' + pageFor(route) + '</div></div></div>';
  bindShell();
}
function bindLogin(){
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    STATE.user = { nome:'João Silva', email: document.getElementById('login-email').value || 'joao@escritoriopereira.com.br' };
    location.hash = '#dashboard';
    render();
  });
}
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){ location.hash = '#' + el.getAttribute('data-nav'); });
  });
  var logoutBtn = document.querySelector('[data-logout]');
  if (logoutBtn) logoutBtn.addEventListener('click', function(){ STATE.user = null; STATE.conciliacao = null; STATE.folhaModal = null; location.hash = '#dashboard'; render(); });

  document.querySelectorAll('[data-roi-period]').forEach(function(el){
    el.addEventListener('click', function(){ roiPeriod = el.getAttribute('data-roi-period'); render(); });
  });

  document.querySelectorAll('[data-conc-confirm]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-conc-confirm'); var s = conciliacaoState();
      s.provavel = s.provavel.filter(function(p){ return p.id !== id; }); s.automatico += 1; render();
    });
  });
  document.querySelectorAll('[data-conc-reject]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-conc-reject'); var s = conciliacaoState();
      s.provavel = s.provavel.filter(function(p){ return p.id !== id; }); render();
    });
  });

  document.querySelectorAll('[data-folha-modal]').forEach(function(el){
    el.addEventListener('click', function(){ STATE.folhaModal = el.getAttribute('data-folha-modal'); render(); });
  });
  document.querySelectorAll('[data-modal-close]').forEach(function(el){
    el.addEventListener('click', function(){ STATE.folhaModal = null; render(); });
  });
  var sendBtn = document.querySelector('[data-folha-send]');
  if (sendBtn) sendBtn.addEventListener('click', function(){ STATE.folhaModal = null; render(); });
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
